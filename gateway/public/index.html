<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Reparc gateway</title>
<style>
:root{color-scheme:dark light;--bg:#0a1012;--card:#121a1d;--line:#243136;--text:#eaf1f1;--muted:#93a5a9;--accent:#c6f432}
@media (prefers-color-scheme:light){:root{--bg:#eef4f4;--card:#fff;--line:#dce6e6;--text:#0f1b1d;--muted:#56686b;--accent:#1e5b66}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px}
h1{font-size:22px;margin:12px 0 8px}p{color:var(--muted);margin:0 0 12px}code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
svg{color:var(--accent)}
</style>
</head>
<body>
<main>
<svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M8 36a16 16 0 1 1 32 0"/><path d="M24 36l8-12"/></svg>
<h1>This is a private Reparc gateway.</h1>
<p>It belongs to one person. It connects their AI apps to the Reparc app on their phone, only while they allow it.</p>
<p>AI apps connect at <code>/mcp</code>. The owner approves each one in the Reparc app.</p>
<p>It stores no workouts, meals, or health data.</p>
</main>
</body>
</html>
