# Publishes the website (site/) to GitHub Pages in the public
# aspershupadhyay/reparc repository, which holds builds and this website
# only (handbook 17.9). It copies the static files in site/ to that
# repository's gh-pages branch. Nothing else from this private repository
# is published. Uses RELEASES_TOKEN (Contents: read and write on reparc).
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      PUBLIC_REPO: aspershupadhyay/reparc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Copy site/ to the public gh-pages branch
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the RELEASES_TOKEN secret (handbook 17.9)."
            exit 1
          fi
          out=$(mktemp -d)
          # Only the static website. vercel.json is not needed on Pages.
          rsync -a --exclude vercel.json site/ "$out/"
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b gh-pages
          git config user.name "reparc-site"
          git config user.email "reparc-site@users.noreply.github.com"
          git add -A
          git commit -q -m "Website from ${GITHUB_SHA::7}"
          # One commit, replaced each time, so the public branch carries no history.
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git" gh-pages
          echo "Published to https://aspershupadhyay.github.io/reparc/"
