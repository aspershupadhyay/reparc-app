# Required pull request checks (handbook 17.5). Release signing is in
# release.yml; the Play upload is done by hand in the Play Console (17.10).
#
# Kept small to save GitHub Actions minutes (owner, 2026-10-11): these
# quick Linux checks run on every pull request that changes code. The
# Android and iPhone builds run only when their own files change
# (android-build.yml, ios-build.yml), and every release builds both.
# Merges to main do not run CI again; the pull request already did.
name: CI

on:
  pull_request:
    paths-ignore: ['handbook/**', 'release-notes/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .tool-versions.
  FLUTTER_VERSION: 3.47.6

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install packages from the lock file
        run: flutter pub get --enforce-lockfile
      - name: Check formatting (generated *.g.dart files excluded)
        run: find lib test -name '*.dart' ! -name '*.g.dart' -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Check generated database code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --timeout 90s

  gateway:
    name: Gateway typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the check that the gateway lists the same tools as the app.
      - run: npm test

  site:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: No third-party requests or trackers
        run: |
          ! grep -RInE 'https?://(fonts\.googleapis|fonts\.gstatic|www\.googletagmanager|www\.google-analytics|plausible|cdn\.)' --include='*.html' --include='*.css' --include='*.js' .
