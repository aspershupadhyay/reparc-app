# Required pull request checks (handbook 17.5). Release signing and store
# upload are separate and are not set up yet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .tool-versions.
  FLUTTER_VERSION: 3.47.6

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install packages from the lock file
        run: flutter pub get --enforce-lockfile
      - name: Check formatting (generated *.g.dart files excluded)
        run: find lib test -name '*.dart' ! -name '*.g.dart' -print0 | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Check generated database code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        run: flutter test --timeout 90s

  gateway:
    name: Gateway typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the check that the gateway lists the same tools as the app.
      - run: npm test

  site:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: No third-party requests or trackers
        run: |
          ! grep -RInE 'https?://(fonts\.googleapis|fonts\.gstatic|www\.googletagmanager|www\.google-analytics|plausible|cdn\.)' --include='*.html' --include='*.css' --include='*.js' .

  android:
    name: Android release build
    runs-on: ubuntu-latest
    # Runs beside the checks instead of after them, to save time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          # Keeps Gradle, its downloads, and its build cache between runs.
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/app/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Release-mode APK for 64-bit ARM phones only (most phones), built the
      # same split way as a release; the release builds every type. Until the
      # Play upload key is set up, Gradle signs it with the debug key, so
      # Google Play will reject it (handbook 17.4).
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 -Pforce-version-code-ignoring-abi=true
      # Uploaded as a plain .apk (no zip) so the owner can install it directly.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS build without signing
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --debug --no-codesign
