# Builds the Android APK and the iPhone IPA and publishes them as a GitHub
# Release in the public aspershupadhyay/reparc repository, which holds no
# source code (handbook
# 17.9). Run it by pushing a tag such as v0.2.0, or from the
# Actions tab. The tag must match the version in app/pubspec.yaml.
#
# Signing, honestly:
# - Android: signed with the upload key when the ANDROID_KEYSTORE_* secrets
#   exist; otherwise with a debug key. Either way it installs from the file.
# - iPhone: not signed by Apple. It is ad-hoc signed with its entitlements so
#   AltStore or Sideloadly can re-sign it with the user's own Apple ID.
#   App Store and TestFlight delivery need the owner's Apple developer account.
# The app never downloads or installs these files itself (AGENTS.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and publish, for example v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: v
        run: |
          name=$(grep -E '^version: ' app/pubspec.yaml | sed -E 's/version: ([0-9.]+)\+.*/\1/')
          if [ "v$name" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match app/pubspec.yaml version $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          # Keeps Gradle, its downloads, and its build cache between runs.
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/app/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Release key (only when the secrets exist)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/upload.jks
            printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::notice::No release key secrets: the APK is signed with a debug key."
          fi
      # One build gives the full APK and one APK per processor type, all with
      # the same version code so any of them can update any other.
      - run: flutter build apk --release --split-per-abi -Pforce-version-code-ignoring-abi=true
      - name: Name the APKs
        run: |
          out=build/app/outputs/flutter-apk
          mkdir -p build/apk
          mv $out/app-release.apk build/apk/reparc-android.apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mv $out/app-$abi-release.apk build/apk/reparc-android-$abi.apk
          done
          ls -l build/apk
      - name: Show the signing certificate
        run: |
          # Every release must carry the same certificate, or Android refuses the update.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in build/apk/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep -E 'certificate DN|SHA-256'
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android
          path: app/build/apk/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iPhone IPA
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
      - name: Ad-hoc sign with entitlements and package the IPA
        run: |
          app=build/ios/iphoneos/Runner.app
          codesign --force --deep --sign - --entitlements ios/Runner/Runner.entitlements "$app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../reparc-ios-unsigned.ipa Payload)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios
          path: app/build/reparc-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum reparc-android*.apk reparc-ios-unsigned.ipa > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          # The source repository is private. Builds go to a public repository
          # that holds only releases (handbook 17.9). RELEASES_TOKEN is a
          # fine-grained token with Contents: read and write on that repo.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: aspershupadhyay/reparc
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the RELEASES_TOKEN secret (Settings → Secrets → Actions). See handbook 17.9."
            exit 1
          fi
          # What's new comes first: the app shows its first line (D-029).
          if [ -f "release-notes/${TAG#v}.md" ]; then
            cat "release-notes/${TAG#v}.md" > notes.md
            echo >> notes.md
          else
            : > notes.md
          fi
          cat >> notes.md <<NOTES
          RepArc ${TAG} (beta). Tested by automated checks; real-device testing is ongoing.

          **Android:** download \`reparc-android.apk\` on the phone and open it (Android 8+; Health Connect needs Android 9+). It works on every phone. The smaller \`reparc-android-arm64-v8a.apk\` fits most phones made since 2017, and the app's own update picks the right one for you.

          **iPhone:** \`reparc-ios-unsigned.ipa\` is not from the App Store. Install it with AltStore or Sideloadly using your own Apple ID (iOS 15+). A free Apple ID must refresh it every 7 days.

          **AI connections:** Me → AI connections. Wi-Fi mode for AI apps on your computer, or the owner's online gateway.

          Check downloads against \`SHA256SUMS.txt\`. The app tells you when a new version is out (Me → App updates); your phone's installer does the install.
          NOTES
          gh release create "$TAG" dist/reparc-android.apk dist/reparc-ios-unsigned.ipa dist/SHA256SUMS.txt \
            --repo "$RELEASES_REPO" --title "RepArc $TAG" --notes-file notes.md --latest
          # Added after the full APK on purpose: app versions before 0.4.9 take
          # the first .apk they find, and the full one installs on every phone.
          gh release upload "$TAG" dist/reparc-android-*.apk --repo "$RELEASES_REPO"
