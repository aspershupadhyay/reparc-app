name: reparc
description: "Reparc: local-first gym and meal logging for iPhone and Android."
publish_to: 'none'
version: 0.4.8+18

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: 6.8.1
  cryptography: 2.9.0
  drift: 2.35.1
  drift_flutter: 0.3.1
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 18.0.2
  health: 13.3.2
  intl: 0.20.3
  lucide_icons_flutter: 3.1.22
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  share_plus: 13.3.1
  timezone: 0.11.1
  url_launcher: 6.3.3
  uuid: 4.6.0
  wakelock_plus: 1.8.1

# dbus is used only by the Linux parts of wakelock_plus and
# flutter_local_notifications, which ask for different minor versions. The
# app ships to Android and iOS only, so the Linux code is never built.
dependency_overrides:
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1
  sqlite3: 3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/licenses/lucide-ISC.txt
    - assets/licenses/free-exercise-db-Unlicense.txt
    - assets/licenses/makehuman-CC0.txt
    - assets/exercises/
    - assets/foods/
    - assets/mcp/
    - assets/exercises/img/
    - assets/body/
    - assets/voice/charlie/
    - assets/voice/charlie/names/
    - assets/voice/matilda/
    - assets/voice/matilda/names/
    - assets/voice/alerts/
    - assets/licenses/elevenlabs-voice.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
