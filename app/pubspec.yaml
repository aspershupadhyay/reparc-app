name: reparc
description: "Reparc: local-first gym and meal logging for iPhone and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: 2.35.1
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  intl: 0.20.3
  lucide_icons_flutter: 3.1.22
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  share_plus: 13.3.1
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.1
  sqlite3: 3.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/licenses/lucide-ISC.txt
    - assets/licenses/free-exercise-db-Unlicense.txt
    - assets/exercises/
    - assets/foods/
    - assets/exercises/img/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
